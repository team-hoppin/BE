spring:
  application:
    name: hoppin

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: never

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-name: Kakao
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - account_email
            provider: kakao

          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: sub

openai:
  api-key: ${OPENAI_API_KEY}
  model: ${OPENAI_MODEL}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: hoppin

  observations:
    key-values:
      application: hoppin

  prometheus:
    metrics:
      export:
        enabled: true

app:
  backend-base-url: ${BACKEND_BASE_URL}
  frontend-base-url: ${FRONTEND_BASE_URL}
  internal-api-key: ${APP_INTERNAL_API_KEY}
  analysis-automation-webhook-url: ${ANALYSIS_AUTOMATION_WEBHOOK_URL:}
  analysis-job-dispatch:
    queue-url: ${ANALYSIS_JOB_DISPATCH_QUEUE_URL:}
    outbox-publish-batch-size: ${ANALYSIS_JOB_OUTBOX_PUBLISH_BATCH_SIZE:20}
    outbox-publish-fixed-delay-millis: ${ANALYSIS_JOB_OUTBOX_PUBLISH_FIXED_DELAY_MILLIS:2000}
    sqs-consume-max-messages: ${ANALYSIS_JOB_SQS_CONSUME_MAX_MESSAGES:5}
    sqs-consume-wait-seconds: ${ANALYSIS_JOB_SQS_CONSUME_WAIT_SECONDS:10}
    sqs-consume-fixed-delay-millis: ${ANALYSIS_JOB_SQS_CONSUME_FIXED_DELAY_MILLIS:1000}

  mail:
    from: ${MAIL_USERNAME}
    from-name: PEAK

crawler:
  instagram:
    base-url: ${INSTAGRAM_CRAWLER_BASE_URL}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 604800000
  refresh-token-expiration: 1209600000

instagram:
  oauth:
    client-id: ${INSTAGRAM_CLIENT_ID}
    client-secret: ${INSTAGRAM_CLIENT_SECRET}
    redirect-uri: ${INSTAGRAM_REDIRECT_URI}
    token-url: https://api.instagram.com/oauth/access_token
    long-lived-token-url: https://graph.instagram.com/access_token
    refresh-token-url: https://graph.instagram.com/refresh_access_token
  graph:
    base-url: https://graph.instagram.com/v22.0

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: none
        secure: true

cloud:
  aws:
    region: ap-northeast-2
    s3:
      bucket: ${AWS_S3_BUCKET}
      base-url: ${AWS_S3_BASE_URL}
